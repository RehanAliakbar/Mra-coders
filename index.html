<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRA Digital Studio</title>
  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #f7f5ef; }
        .ssr-preloader { position: fixed; inset: 0; background: #1a1b18; display: flex; align-items: center; justify-content: center; z-index: 99999; }
        .ssr-text { font-family: sans-serif; font-size: 32px; font-weight: bold; letter-spacing: 2px; color: #f2e8c6; text-transform: uppercase; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
      </style>
      <div class="ssr-preloader"><div class="ssr-text">MRA STUDIO</div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
